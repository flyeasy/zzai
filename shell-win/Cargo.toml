[package]
name = "eryu-shell-win"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_Controls",
  "Win32_System_LibraryLoader",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_System_Diagnostics_Debug",
  "Win32_UI_HiDpi",
  "Media_Control",
  "Win32_UI_Accessibility",
  "Win32_System_Com",
  "Win32_System_Variant",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
